[project]
name = "portafolio-data-science"
version = "0.1.0"
description = "Portafolio de proyectos de Data Science, Machine Learning y Ciberseguridad"
authors = [
    {name = "Juan Esteban Infante Andrade"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
    "tensorflow>=2.13.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.9",
    "langchain-community>=0.0.10",
    "duckduckgo-search>=4.4.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configuración específica para demostrar manejo avanzado con uv
[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",      # Linter ultrarrápido (escrito en Rust, combado con uv)
    "black>=23.7.0"
]
